<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Gall Sigler</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="constant-lightest">
            <div>
                <div id="main-title">
                    <div>
                        <h1>Welcome to my site!</h1>
                        <p>Below I include some information about my data projects, academic publications, and journalistic writing.</p>
                        <p><b>This site also aims to demonstrate self-taught skills in HTML, CSS and JavaScript. (The code for the site is available in the projects section, too.)</b></p>
                    </div>
                </div>
                <div id="buttons-container">
                    <button id="projects" class="buttons-style">Projects</button>
                    <button id="writing" class="buttons-style">Writing</button>
                    <button id="resume" class="buttons-style">Resume</button>
                </div>
            </div>
        </div>
        <div id="writing-text" class="invisible">
            <div class="constant-medium"> 
                <button id="writing-back-button" class="backbutton"><b>&#8963</b></button>
                <br> 
                <div class="writing-buttons">
                    <button class="buttons-style" id="writing-journalism">Journalism</button>
                    <button class="buttons-style" id="writing-academic">Academic</button>
                </div>
            </div>
        </div>

        <div id="project-text" class="invisible">
            <div class="constant-medium"> 
                <button id="project-back-button" class="backbutton"><b>&#8963</b></button>
                <br> 
                <div class="writing-buttons">
                    <button class="buttons-style" id="writing-journalism">Data</button>
                    <button class="buttons-style" id="writing-academic">Non-Data</button>
                </div>
            </div>
        </div>

        <script src="logic.js"></script>
    </body>

</html>
